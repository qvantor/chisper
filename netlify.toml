[build]
  command = "npm run build"
  publish = "dist/apps/chisper"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `netlify dev` serves only the functions: `npm start` runs the Nx dev server itself (a framework detected here,
# Astro of apps/site, would start a server of its own and wait for its port)
[dev]
  framework = "#static"

# Local certificates for `netlify dev` over HTTPS, generated by `npm run certs` (mkcert).
[dev.https]
  certFile = ".certs/cert.pem"
  keyFile = ".certs/key.pem"

# the assets of the promo pages (apps/site): their names are hashes of their contents
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# the old domain of the synth (a domain alias of the site) before its rename to Chisper: every link, a preset's
# (?preset=, the query goes along) and the promo pages too, opens on the new one
[[redirects]]
  from = "https://waveform.qvantor.org/*"
  to = "https://chisper.qvantor.org/:splat"
  status = 301
  force = true

# the files of the buckets through the site, where their domains don't load (Cloudflare throttled or blocked on
# the way: the browser talks only to Netlify, which fetches them): the fallback of `bucketLoader` of the app
[[redirects]]
  from = "/files/wavetables/*"
  to = "https://wavetables.chisper.qvantor.org/:splat"
  status = 200

[[redirects]]
  from = "/files/noises/*"
  to = "https://noises.chisper.qvantor.org/:splat"
  status = 200

# the analytics and the error reports of the synth (PostHog Cloud EU) through the site: a blocker sees no domain of
# theirs. The path is ANALYTICS_PATH of apps/chisper/src/app/common/services/analytics.ts (no word a filter list
# blocks); the assets first, as PostHog's guide for Netlify has them. Only on a domain of the site: *.netlify.app
# changes the encoding of a proxied request (the app sends nothing there)
[[redirects]]
  from = "/stave/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/stave/array/*"
  to = "https://eu-assets.i.posthog.com/array/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/stave/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true

# the folders of the manual and of Learn (apps/site) have no page of their own: each opens its hub, the Getting
# started of the manual and the first article of Learn, in its language (Netlify takes a path with and without its
# trailing slash alike)
[[redirects]]
  from = "/manual/"
  to = "/manual/getting-started/"
  status = 301

[[redirects]]
  from = "/es/manual/"
  to = "/es/manual/primeros-pasos/"
  status = 301

[[redirects]]
  from = "/de/anleitung/"
  to = "/de/anleitung/erste-schritte/"
  status = 301

[[redirects]]
  from = "/learn/"
  to = "/learn/what-is-wavetable-synthesis/"
  status = 301

[[redirects]]
  from = "/es/aprende/"
  to = "/es/aprende/que-es-la-sintesis-wavetable/"
  status = 301

[[redirects]]
  from = "/de/lernen/"
  to = "/de/lernen/was-ist-wavetable-synthese/"
  status = 301
