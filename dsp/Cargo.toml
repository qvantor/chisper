# the DSP of the audio worklet in Rust → wasm32 (scripts/wasm.mjs, `npm run wasm`): one .wasm for the one node of
# the sound (engine: the voices and the store of their tables, wavetable-osc, into the chain: the effects, the master
# and the limiter), the JS of the worklet only wraps its processor. jsmath and dsp-core are shared; every value is
# worked out as the TS cores do it (the specs compare the bits)
[workspace]
resolver = "2"
members = ["jsmath", "jsmath-check", "wasm-rt", "dsp-core", "limiter", "reverb", "distortion", "compressor", "chorus", "chain", "wavetable-osc", "engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

# the ports keep the loops and the arguments of the TS: indexes over several arrays, the render loops of the voice
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
